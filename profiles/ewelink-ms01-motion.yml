name: ewelink-ms01-motion
components:
  - id: main
    capabilities:
      - id: motionSensor
        version: 1
      - id: battery
        version: 1
      - id: buildbook37604.driverInformation
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: MotionSensor
preferences:
  - name: detectionInterval
    title: 감지 주기
    description: 반복 감지 신호를 처리할 최소 간격입니다. 센서 자체의 하드웨어 전송 주기보다 짧게 설정해도 실제 전송 주기는 빨라지지 않습니다.
    required: true
    preferenceType: number
    definition:
      minimum: 0.1
      maximum: 3600
      default: 0.1
  - name: inactiveInterval
    title: 미감지 주기
    description: 마지막으로 처리한 감지 신호 이후 미감지로 변경할 시간입니다.
    required: true
    preferenceType: number
    definition:
      minimum: 0.1
      maximum: 3600
      default: 15
  - name: extendOnMotion
    title: 감지 시 미감지 시간 연장
    description: 켜면 새 감지가 들어올 때마다 미감지 타이머를 다시 시작합니다. 끄면 최초 감지 후 정해진 시간에 미감지로 변경됩니다.
    required: true
    preferenceType: boolean
    definition:
      default: true
